name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ccodex
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ccodex.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux 侧 C 依赖：zstd-sys / ring / aws-lc-sys 需要 gcc；native-tls 需要 openssl 头文件
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      # 同步官方源码 + 应用锚定补丁（patch 失效会直接失败，不会静默降级）
      - name: Sync upstream codex
        run: python tools/sync_upstream.py

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build ccodex
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccodex-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
