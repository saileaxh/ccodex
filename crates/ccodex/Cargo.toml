[package]
name = "ccodex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Codex relay built on official openai/codex crates - byte-identical upstream behavior"

[dependencies]
# Official crates (vendored source + anchored patches from patches/patches.json,
# maintained by tools/sync_upstream.py)
codex-api = { path = "../../vendor/codex/codex-rs/codex-api" }
codex-backend-client = { path = "../../vendor/codex/codex-rs/backend-client" }
codex-login = { path = "../../vendor/codex/codex-rs/login" }
codex-model-provider = { path = "../../vendor/codex/codex-rs/model-provider" }
codex-model-provider-info = { path = "../../vendor/codex/codex-rs/model-provider-info" }
codex-http-client = { path = "../../vendor/codex/codex-rs/http-client" }

anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http = "1.3"
# The socks feature flows through feature unification into the official reqwest client,
# enabling socks5/socks5h proxies (incl. credentials embedded in the URL), so env proxies
# like ALL_PROXY=socks5://user:pass@... work.
reqwest = { version = "0.12", features = ["socks"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "v7"] }

[build-dependencies]
# build.rs uses only the standard library

[dev-dependencies]
tempfile = "3"
